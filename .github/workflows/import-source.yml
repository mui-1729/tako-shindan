name: Import source bundle
on:
  push:
    paths:
      - '.bundle/READY'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract source
        shell: bash
        run: |
          cat .bundle/part{00..06} > /tmp/tako-source.b64
          base64 --decode /tmp/tako-source.b64 | tar -xJf - --strip-components=1
          rm -rf .bundle
      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: initialize Tako Shindan MVP"
            git push origin HEAD:main
          fi
